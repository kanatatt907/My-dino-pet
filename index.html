<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DinoBond</title>
    
    <!-- PWA 設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f0f9ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes floatUp { from { transform: translateY(100px); opacity: 0; } 50% { opacity: 0.6; } to { transform: translateY(-20px); opacity: 0; } }
        @keyframes dropFeed { 0% { transform: translateY(-20px) scale(0.5); opacity: 0; } 50% { transform: translateY(40px) scale(1.2); opacity: 1; } 80% { transform: translateY(50px) scale(1); opacity: 1; } 100% { transform: translateY(60px) scale(0); opacity: 0; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes swim { 0%, 100% { transform: translateX(0) rotate(0deg); } 25% { transform: translateX(5px) rotate(1deg); } 75% { transform: translateX(-5px) rotate(-1deg); } }
        
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
            background-color: #f0f9ff;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconHeart = ({ className, fill }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill={fill || "none"} stroke="currentColor" strokeWidth="2" className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
        const IconUtensils = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>;
        const IconMoon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;
        const IconMap = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></svg>;
        const IconBackpack = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M9 10v6"/><path d="M15 10v6"/><path d="M9 14h6"/></svg>;
        const IconSparkles = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 3v4"/><path d="M3 5h4"/><path d="M3 9h4"/></svg>;
        const IconHand = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>;
        const IconTrophy = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;
        const IconSave = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;

        const CuteDino = ({ state, mood, isEating, showHearts, level }) => {
          let eyeType = 'open', mouthType = 'smile';
          if (state === 'SLEEPING') { eyeType = 'closed-sleep'; mouthType = 'smile'; }
          else if (isEating || showHearts) { eyeType = 'closed-happy'; mouthType = 'smile'; if(isEating) mouthType = 'open'; }
          else if (mood < 30) { eyeType = 'sad'; mouthType = 'flat'; }
          const isAdult = level >= 10, isTeen = level >= 5 && level < 10;
          const bodyColor = isAdult ? "#7CB9E8" : "#89CFF0";
          const bellyColor = "#C6E6FB";
          const stripeColor = isAdult ? "#5C6BC0" : "#9FA8DA";
          const blushColor = "#FFB7B2";
          return (
            <svg viewBox="0 0 200 200" className="w-full h-full drop-shadow-xl transition-all duration-1000">
              <path d="M60 135 Q 40 150 45 160 Q 60 165 80 145" fill="#64B5F6" stroke="none" />
              <path d="M110 135 Q 100 160 110 170 Q 130 170 140 140" fill="#64B5F6" stroke="none" />
              <path d="M 20 140 Q 50 140, 70 120 Q 100 110, 130 110 Q 150 110, 160 80 Q 165 50, 180 50 Q 195 50, 195 65 Q 195 75, 180 80 Q 165 85, 150 125 Q 140 150, 100 150 Q 60 150, 20 140 Z" fill={bodyColor} stroke="#5499C7" strokeWidth="2" strokeLinejoin="round" />
              <path d="M 70 145 Q 100 145, 135 130 Q 145 120, 160 85 Q 150 120, 130 135 Q 100 155, 70 145" fill={bellyColor} opacity="0.8" />
              <path d="M 60 128 Q 65 115 70 128" fill={stripeColor} opacity="0.8" />
              <path d="M 85 118 Q 90 105 95 118" fill={stripeColor} opacity="0.8" />
              <path d="M 110 115 Q 115 102 120 115" fill={stripeColor} opacity="0.8" />
              {isTeen && <path d="M 135 110 Q 140 95 145 110" fill={stripeColor} opacity="0.8" />}
              {isAdult && <path d="M 135 110 Q 140 95 145 110" fill={stripeColor} opacity="0.8" />}
              {isAdult && <path d="M 155 95 Q 160 80 165 95" fill={stripeColor} opacity="0.8" />}
              <path d="M50 140 Q 30 155 40 165 Q 60 170 75 145" fill={bodyColor} stroke="#5499C7" strokeWidth="2" />
              <path d="M100 145 Q 90 170 105 180 Q 130 175 135 145" fill={bodyColor} stroke="#5499C7" strokeWidth="2" />
              <g transform="translate(180, 58)">
                {eyeType === 'open' && <g><circle cx="0" cy="0" r="5" fill="#333" /><circle cx="2" cy="-2" r="2" fill="white" /></g>}
                {(eyeType === 'closed-sleep' || eyeType === 'sad') && <path d="M-4 2 Q 0 6 4 2" stroke="#333" strokeWidth="2" fill="none" />}
                {eyeType === 'closed-happy' && <path d="M-4 2 Q 0 -4 4 2" stroke="#333" strokeWidth="2" fill="none" />}
                {(showHearts || isEating || mood > 80) && <ellipse cx="-2" cy="8" rx="4" ry="2" fill={blushColor} opacity="0.6" />}
                {mouthType === 'smile' && <path d="M 5 5 Q 10 5 12 0" stroke="#333" strokeWidth="2" fill="none" strokeLinecap="round" />}
                {mouthType === 'flat' && <path d="M 5 5 L 12 5" stroke="#333" strokeWidth="2" fill="none" strokeLinecap="round" />}
                {mouthType === 'open' && <circle cx="8" cy="5" r="4" fill="#FF6B6B" stroke="#333" strokeWidth="1" />}
              </g>
            </svg>
          );
        };

        function DinoPet() {
          const initialStats = { hunger: 80, mood: 80, energy: 100, level: 1, xp: 0, maxXp: 100, lastSaveTime: Date.now() };
          const [stats, setStats] = useState(initialStats);
          const [gameState, setGameState] = useState('IDLE');
          const [inventory, setInventory] = useState([]);
          const [logs, setLogs] = useState([]);
          const [pettingIntensity, setPettingIntensity] = useState(0); 
          const [activePetZone, setActivePetZone] = useState(null);
          const [showHearts, setShowHearts] = useState(false);
          const [feedingAnim, setFeedingAnim] = useState(false);
          const [levelUpAnim, setLevelUpAnim] = useState(false);
          const [exploreTime, setExploreTime] = useState(0);
          const [isLoaded, setIsLoaded] = useState(false);

          useEffect(() => {
            const savedData = localStorage.getItem('dinoPetSave');
            if (savedData) {
              try {
                const parsedData = JSON.parse(savedData);
                const now = Date.now();
                const timeDiffSeconds = (now - parsedData.stats.lastSaveTime) / 1000;
                const offlineDecay = 0.1; 
                let newHunger = Math.max(0, Math.min(100, parsedData.stats.hunger - (timeDiffSeconds * 0.05 * offlineDecay))); 
                let newMood = Math.max(0, Math.min(100, parsedData.stats.mood - (timeDiffSeconds * 0.08 * offlineDecay)));
                let newEnergy = Math.max(0, Math.min(100, parsedData.stats.energy + (timeDiffSeconds * 0.5))); 
                setStats({ ...parsedData.stats, hunger: newHunger, mood: newMood, energy: newEnergy, lastSaveTime: now });
                setInventory(parsedData.inventory || []);
                setLogs(timeDiffSeconds > 60 ? [`離開了 ${Math.floor(timeDiffSeconds/60)} 分鐘。`] : ["歡迎回來！"]);
              } catch (e) { setLogs(["存檔讀取失敗。"]); }
            } else { setLogs(["歡迎來到恐龍新世界！"]); }
            setIsLoaded(true);
          }, []);

          useEffect(() => {
            if (!isLoaded) return;
            const saveGame = () => localStorage.setItem('dinoPetSave', JSON.stringify({ stats: { ...stats, lastSaveTime: Date.now() }, inventory }));
            const saveInterval = setInterval(saveGame, 5000);
            window.addEventListener('beforeunload', saveGame);
            return () => { clearInterval(saveInterval); window.removeEventListener('beforeunload', saveGame); };
          }, [stats, inventory, isLoaded]);

          const gainXp = (amount) => {
            setStats(prev => {
              let newXp = prev.xp + amount, newLevel = prev.level, newMaxXp = prev.maxXp, didLevelUp = false;
              while (newXp >= newMaxXp) { newXp -= newMaxXp; newLevel++; newMaxXp = Math.floor(newMaxXp * 1.2 + 50); didLevelUp = true; }
              if (didLevelUp) { setLevelUpAnim(true); setTimeout(() => setLevelUpAnim(false), 2000); }
              return { ...prev, level: newLevel, xp: newXp, maxXp: newMaxXp };
            });
          };

          useEffect(() => {
            if (!isLoaded) return;
            const timer = setInterval(() => {
              setStats(prev => {
                if (gameState === 'SLEEPING') return { ...prev, hunger: Math.max(0, prev.hunger - 0.02), mood: Math.max(0, prev.mood - 0.02), energy: Math.min(100, prev.energy + 2) };
                if (gameState === 'EXPLORING') return { ...prev, hunger: Math.max(0, prev.hunger - 0.3), energy: Math.max(0, prev.energy - 0.3) };
                return { ...prev, hunger: Math.max(0, prev.hunger - 0.05), mood: Math.max(0, prev.mood - 0.08), energy: Math.max(0, prev.energy - 0.05) };
              });
            }, 1000);
            return () => clearInterval(timer);
          }, [gameState, isLoaded]);

          useEffect(() => {
            if (gameState !== 'EXPLORING') return;
            setExploreTime(5);
            const exploreTimer = setInterval(() => setExploreTime(p => { if (p <= 1) { finishExploration(); return 0; } return p - 1; }), 1000);
            return () => clearInterval(exploreTimer);
          }, [gameState]);

          const finishExploration = () => {
            setGameState('IDLE');
            gainXp(15);
            const rewards = [{ name: "奇怪的骨頭", icon: "🦴", type: 'toy', value: 20 }, { name: "閃亮石頭", icon: "💎", type: 'toy', value: 50 }, { name: "古代蕨類", icon: "🌿", type: 'food', value: 15 }, { name: "深海貝殼", icon: "🐚", type: 'toy', value: 30 }, { name: "什麼都沒找到...", icon: "💨", type: 'junk' }];
            const found = rewards[Math.floor(Math.random() * rewards.length)];
            if (found.type !== 'junk') { setInventory(prev => [...prev, found]); addLog(`發現了 [${found.name}] (+15 XP)`); setStats(prev => ({ ...prev, mood: Math.min(100, prev.mood + 10) })); } else addLog(`什麼都沒發現... (+15 XP)`);
          };

          const addLog = (msg) => setLogs(prev => [msg, ...prev].slice(0, 5));
          const useItem = (item, index) => {
            if (gameState !== 'IDLE') return;
            setInventory(p => { const n = [...p]; n.splice(index, 1); return n; });
            if (item.type === 'food') { triggerFeedAnim(item.icon); setStats(p => ({ ...p, hunger: Math.min(100, p.hunger + item.value) })); gainXp(5); }
            else { setShowHearts(true); setTimeout(() => setShowHearts(false), 1000); setStats(p => ({ ...p, mood: Math.min(100, p.mood + item.value) })); gainXp(5); }
          };

          const feed = () => {
            if (gameState !== 'IDLE') return;
            if (stats.hunger >= 100) { addLog("太飽了！"); return; }
            triggerFeedAnim('🐟'); setStats(p => ({ ...p, hunger: Math.min(100, p.hunger + 30), energy: p.energy - 2 })); gainXp(2);
          };
          const triggerFeedAnim = (icon) => { setFeedingAnim(icon); setTimeout(() => setFeedingAnim(false), 1000); };
          const toggleSleep = () => { setGameState(g => g === 'SLEEPING' ? 'IDLE' : 'SLEEPING'); };
          const goExplore = () => { if (stats.energy < 20) { addLog("太累了..."); return; } setGameState('EXPLORING'); };
          const startPetting = (z) => { if (gameState === 'IDLE') setActivePetZone(z); };
          const stopPetting = () => { setActivePetZone(null); setPettingIntensity(0); };
          const handlePetMove = () => { if (gameState === 'IDLE' && activePetZone) setPettingIntensity(p => { if (p + 8 > 80) { triggerZoneEffect(activePetZone); return 0; } return p + 8; }); };
          const triggerZoneEffect = (zone) => { setShowHearts(true); if (navigator.vibrate) navigator.vibrate(50); gainXp(1); setStats(p => ({ ...p, mood: Math.min(100, p.mood + (zone === 'head' ? 6 : 3)) })); setTimeout(() => setShowHearts(false), 800); };
          useEffect(() => { const i = setInterval(() => setPettingIntensity(p => Math.max(0, p - 15)), 200); return () => clearInterval(i); }, []);
          const resetGame = () => { if(confirm("確定重置？")) { localStorage.removeItem('dinoPetSave'); window.location.reload(); } };

          if (!isLoaded) return <div className="flex items-center justify-center min-h-screen text-sky-600">讀取中...</div>;

          return (
            <div className="flex flex-col items-center justify-center min-h-screen p-4" onMouseUp={stopPetting} onTouchEnd={stopPetting}>
              <div className="w-full max-w-md mb-4 flex items-center justify-between">
                  <div><h1 className="text-xl font-bold text-sky-800">DinoBond</h1><button onClick={resetGame} className="text-xs text-sky-300 underline">重置</button></div>
                  <div className="flex flex-col items-end gap-1">
                    <div className={`bg-white px-3 py-1 rounded-full shadow text-sm font-bold border flex items-center gap-2 ${stats.level >= 10 ? 'text-indigo-600 border-indigo-200' : 'text-sky-600 border-sky-100'}`}>
                        {stats.level >= 10 ? <IconTrophy className="w-4 h-4" /> : <IconSparkles className="w-4 h-4" />}
                        <span>Lv.{stats.level} {stats.level >= 10 ? "成體" : stats.level >= 5 ? "少年" : "寶寶"}</span>
                    </div>
                    <div className="w-32 h-2 bg-sky-100 rounded-full border border-sky-200 relative"><div className="h-full bg-yellow-400 transition-all duration-500" style={{ width: `${Math.min(100, (stats.xp / stats.maxXp) * 100)}%` }} /></div>
                  </div>
              </div>

              <div className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-sky-200 relative">
                <div className={`h-80 relative transition-all duration-1000 overflow-hidden ${gameState === 'SLEEPING' ? 'bg-slate-800' : gameState === 'EXPLORING' ? 'bg-blue-300' : 'bg-cyan-100'}`}>
                  {levelUpAnim && <div className="absolute inset-0 z-50 flex items-center justify-center bg-white/50 animate-pulse"><div className="bg-yellow-400 text-white px-6 py-3 rounded-full text-2xl font-bold shadow-xl animate-bounce">LEVEL UP!</div></div>}
                  <div className="absolute top-2 left-2 text-sky-900/20 text-[10px] flex items-center gap-1"><IconSave className="w-3 h-3" /> 自動存檔</div>

                  {gameState === 'EXPLORING' ? (
                     <div className="absolute inset-0 flex items-end pb-12 overflow-hidden">
                        <div className="absolute bottom-0 left-1/4 animate-[floatUp_3s_linear_infinite] text-xl opacity-60">🫧</div>
                        <div className="absolute top-4 w-full text-center"><span className="bg-black/30 text-white px-4 py-1 rounded-full text-sm font-bold">潛水中... {exploreTime}s</span></div>
                        <div className="w-full flex justify-center animate-[swim_2s_ease-in-out_infinite] mb-8"><div className="w-40 h-40"><CuteDino state="EXPLORING" mood={stats.mood} level={stats.level} /></div></div>
                     </div>
                  ) : (
                    <div className="relative w-full h-full flex items-center justify-center pt-8">
                        {showHearts && <div className="absolute top-10 right-10 animate-bounce z-20"><IconHeart fill="#ff6b6b" className="text-red-400 w-10 h-10 drop-shadow-lg" /></div>}
                        {feedingAnim && <div className="absolute top-4 right-10 z-30 animate-[dropFeed_1s_ease-in-out_forwards]"><div className="text-6xl">{feedingAnim}</div></div>}
                        <div className={`w-80 h-64 relative transition-transform duration-500 ease-in-out ${stats.level >= 10 ? 'scale-125' : stats.level >= 5 ? 'scale-110' : 'scale-100'} ${showHearts ? 'rotate-1 scale-[1.05]' : ''} ${gameState === 'IDLE' ? 'animate-[float_4s_ease-in-out_infinite]' : ''}`}>
                          <CuteDino state={gameState} mood={stats.mood} isEating={!!feedingAnim} showHearts={showHearts} level={stats.level} />
                          {gameState === 'IDLE' && !feedingAnim && (
                              <>
                                <div className="absolute top-0 right-8 w-28 h-28 rounded-full z-10 cursor-grab active:cursor-grabbing" onMouseDown={() => startPetting('head')} onTouchStart={(e) => { e.preventDefault(); startPetting('head'); }} onMouseMove={handlePetMove} onTouchMove={handlePetMove}></div>
                                <div className="absolute bottom-10 left-4 w-60 h-28 rounded-full z-10 cursor-grab active:cursor-grabbing" onMouseDown={() => startPetting('body')} onTouchStart={(e) => { e.preventDefault(); startPetting('body'); }} onMouseMove={handlePetMove} onTouchMove={handlePetMove}></div>
                              </>
                          )}
                        </div>
                    </div>
                  )}
                  {gameState === 'IDLE' && <p className="absolute bottom-2 w-full text-center text-xs text-sky-600 opacity-60 flex items-center justify-center gap-1"><IconHand className="w-3 h-3" /> 按住並來回摩擦以撫摸</p>}
                </div>

                <div className="p-5 space-y-3 bg-white">
                  <StatBar icon={<IconUtensils className="w-4 h-4" />} label="飽食" value={stats.hunger} color="bg-orange-400" />
                  <StatBar icon={<IconHeart className="w-4 h-4" />} label="心情" value={stats.mood} color="bg-pink-400" />
                  <StatBar icon={<IconSparkles className="w-4 h-4" />} label="體力" value={stats.energy} color="bg-blue-400" />
                </div>

                <div className="h-20 bg-sky-50 px-4 py-2 border-t border-sky-100 overflow-y-auto text-sm text-sky-600 font-medium">
                  {logs.map((log, i) => <p key={i} className="mb-1 border-l-2 border-sky-300 pl-2">{log}</p>)}
                </div>

                <div className="grid grid-cols-3 gap-1 p-2 bg-sky-50">
                  <ActionButton onClick={feed} icon={<IconUtensils className="w-4 h-4" />} label="餵魚" disabled={gameState !== 'IDLE'} />
                  <ActionButton onClick={goExplore} icon={<IconMap className="w-4 h-4" />} label="潛水" disabled={gameState !== 'IDLE'} />
                  <ActionButton onClick={toggleSleep} icon={<IconMoon className="w-4 h-4" />} label={gameState === 'SLEEPING' ? "起床" : "睡覺"} active={gameState === 'SLEEPING'} />
                </div>
              </div>
              
              <div className="w-full max-w-md mt-4">
                <div className="bg-white rounded-2xl shadow-sm p-4">
                    <div className="flex items-center gap-2 mb-3 text-sky-700 font-bold"><IconBackpack className="w-5 h-5" /><span>背包 ({inventory.length})</span></div>
                    {inventory.length === 0 ? <div className="text-center py-4 text-sky-400 text-sm border-2 border-dashed border-sky-200 rounded">空空如也...</div> : (
                        <div className="grid grid-cols-4 gap-2">{inventory.map((item, idx) => (
                                <button key={idx} onClick={() => useItem(item, idx)} className="aspect-square flex flex-col items-center justify-center bg-sky-50 border border-sky-200 rounded-lg active:scale-95">
                                    <span className="text-2xl mb-1">{item.icon}</span>
                                </button>
                            ))}
                        </div>
                    )}
                </div>
              </div>
            </div>
          );
        }

        const StatBar = ({ icon, label, value, color }) => (
            <div className="flex items-center gap-3">
              <div className="text-sky-400">{icon}</div>
              <div className="flex-1">
                <div className="flex justify-between text-xs text-sky-600 mb-1 font-bold"><span>{label}</span><span>{Math.round(value)}%</span></div>
                <div className="h-2.5 w-full bg-sky-100 rounded-full overflow-hidden border border-sky-100"><div className={`h-full transition-all duration-700 ease-out ${color}`} style={{ width: `${value}%` }} /></div>
              </div>
            </div>
        );

        const ActionButton = ({ onClick, icon, label, disabled, active }) => (
            <button onClick={onClick} disabled={disabled} className={`flex flex-col items-center justify-center p-3 rounded-xl transition-all ${active ? 'bg-sky-700 text-white' : 'bg-white text-sky-600 hover:bg-blue-50'} ${disabled ? 'opacity-40 cursor-not-allowed grayscale' : 'shadow-sm active:scale-95 border-b-4 border-sky-200 active:border-b-0 active:translate-y-[4px]'}`}>
              <div className="mb-1">{icon}</div><span className="text-xs font-bold">{label}</span>
            </button>
        );

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.log('Service Worker failed', err));
            });
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DinoPet />);
    </script>
</body>
</html>
